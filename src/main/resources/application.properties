spring.application.name=empleados-seguridad-api
server.port=8080

# =====================================================================
# CONFIGURACIÓN POR DEFECTO: H2 EN MODO MYSQL COMPATIBLE
# Permite ejecución y pruebas inmediatas sin necesidad de servidor externo.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:seguridaddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 para inspección web
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.jpa.open-in-view=false
# =====================================================================
# CONFIGURACIÓN PARA MYSQL SERVER (PRODUCCIÓN / ENTREGA LOCAL)
# Para conectar a MySQL local, comenta el bloque H2 y descomenta lo siguiente:
# =====================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/seguridaddb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=TU_PASSWORD_MYSQL
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
